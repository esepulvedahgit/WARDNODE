services:
  console:
    build: .
    container_name: wardnode-console
    env_file:
      - .env
    environment:
      WF_SOCKET_PATH: /app/sockets/wardnode-wf.sock
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app/app:ro
      - ./host-agent:/app/host-agent:ro
      - ./wsgi.py:/app/wsgi.py:ro
      - proxy_generated:/app/generated/nginx
      - fluent_bit_config:/app/generated/fluent-bit
      - geoip_data:/app/data/geoip
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/wardnode:/app/sockets:rw
      - ${WARDNODE_PROJECT_DIR:-/home/esepulvedah/wardnode}:${WARDNODE_PROJECT_DIR:-/home/esepulvedah/wardnode}:ro
      - modsecurity_logs:/var/log/modsec:ro
    group_add:
      - "1500"  # grupo wardnode del host — acceso al socket Unix del agente WF
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wardnode_internal
    command: sh -c "flask init-db && flask ensure-geoip && flask run --host=0.0.0.0 --port=5000"

  proxy:
    build:
      context: ./proxy
    container_name: wardnode-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - proxy_generated:/etc/nginx/generated:ro
      - geoip_data:/etc/nginx/geoip:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot
      - ./certs:/etc/nginx/certs:ro
      - proxy_logs:/var/log/nginx
      - modsecurity_logs:/var/log
    depends_on:
      - console
    networks:
      - wardnode_internal

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot
    entrypoint: certbot

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wardnode_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── WardNode OBS — Observabilidad (perfil opcional) ──────────────────
  alloy:
    image: grafana/alloy:latest
    container_name: wardnode-alloy
    restart: unless-stopped
    profiles:
      - obs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - proxy_logs:/var/log/nginx:ro
      - modsecurity_logs:/var/log/modsec:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - wardnode_internal

  loki:
    image: grafana/loki:3
    container_name: wardnode-loki
    restart: unless-stopped
    profiles:
      - obs
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki_data:/loki
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
    networks:
      - wardnode_internal

  grafana:
    image: grafana/grafana:11.5
    container_name: wardnode-grafana
    restart: unless-stopped
    profiles:
      - obs
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-wardnode}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/obs/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LOG_LEVEL: warn
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - wardnode_internal

  prometheus:
    image: prom/prometheus:latest
    container_name: wardnode-prometheus
    restart: unless-stopped
    profiles:
      - obs
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - wardnode_internal

  # ── WardNode Syslog — Reenvío de logs ────────────────────────────────
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: wardnode-fluent-bit
    restart: unless-stopped
    # Genera una config noop si todavía no existe ninguna (primer arranque)
    command: >
      sh -c "[ -f /fluent-bit/etc/fluent-bit.conf ] ||
      printf '[SERVICE]\n    Flush 60\n    Daemon Off\n    Log_Level warn\n'
      > /fluent-bit/etc/fluent-bit.conf;
      exec /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.conf"
    volumes:
      - fluent_bit_config:/fluent-bit/etc
      - proxy_logs:/var/log/nginx:ro
      - modsecurity_logs:/var/log/modsec:ro
    networks:
      - wardnode_internal

volumes:
  postgres_data:
  proxy_generated:
  fluent_bit_config:
  geoip_data:
  proxy_logs:
  modsecurity_logs:
  letsencrypt:
  certbot_challenges:
  loki_data:
  grafana_data:
  alloy_data:
  prometheus_data:

networks:
  wardnode_internal:
    driver: bridge
