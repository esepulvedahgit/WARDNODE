services:
  console:
    build: .
    container_name: wardnode-console
    env_file:
      - .env
    environment:
      WF_SOCKET_PATH: /app/sockets/wardnode-wf.sock
      # Contenedor del que se ingieren los eventos ModSecurity (WAF Events + módulo SOC)
      WARDNODE_PROXY_CONTAINER: wardnode-proxy
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app/app:ro
      - ./host-agent:/app/host-agent:ro
      - ./wsgi.py:/app/wsgi.py:ro
      - proxy_generated:/app/generated/nginx
      - geoip_data:/app/data/geoip
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/wardnode:/app/sockets:rw
      - ${WARDNODE_PROJECT_DIR:-/home/esepulvedah/wardnode}:${WARDNODE_PROJECT_DIR:-/home/esepulvedah/wardnode}:ro
      - modsecurity_logs:/var/log/modsec:ro
      - backups:/app/data/backups
      - log-archives:/app/data/log-archives
      - letsencrypt:/etc/letsencrypt:ro
    group_add:
      - "1500"  # grupo wardnode del host — acceso al socket Unix del agente WF
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wardnode_internal
    command: sh -c "flask init-db && flask ensure-geoip && flask run --host=0.0.0.0 --port=5000"

  proxy:
    build:
      context: ./proxy
    container_name: wardnode-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - proxy_generated:/etc/nginx/generated:ro
      - geoip_data:/etc/nginx/geoip:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot
      - ./certs:/etc/nginx/certs:ro
      - proxy_logs:/var/log/nginx
      - modsecurity_logs:/var/log
    depends_on:
      - console
    networks:
      wardnode_internal:
        ipv4_address: 172.30.0.10

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot
    entrypoint: certbot

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wardnode_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── WardNode OBS — Recolección/almacenamiento (arrancan siempre) ─────
  # Loki + Alloy + Prometheus arrancan con el stack base para minimizar
  # la fuga de logs. Solo Grafana (visualización) está detrás del módulo OBS.
  alloy:
    image: grafana/alloy:latest
    container_name: wardnode-alloy
    restart: unless-stopped
    mem_limit: 256m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - proxy_logs:/var/log/nginx:ro
      - modsecurity_logs:/var/log/modsec:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - wardnode_internal

  loki:
    image: grafana/loki:3
    container_name: wardnode-loki
    restart: unless-stopped
    mem_limit: 256m
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki_data:/loki
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
    networks:
      - wardnode_internal

  # ── WardNode OBS — Visualización (perfil opcional, módulo OBS) ────────
  grafana:
    image: grafana/grafana:11.5
    container_name: wardnode-grafana
    restart: unless-stopped
    profiles:
      - obs
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-wardnode}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/obs/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LOG_LEVEL: warn
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"
      GF_AUTH_PROXY_WHITELIST: "172.30.0.10/32"
      # Credenciales DB para el datasource PostgreSQL de Grafana (rol read-only grafana_ro)
      # En dev se usa el mismo rol 'app' como fallback — en prod apunta a grafana_ro
      POSTGRES_DB: ${POSTGRES_DB:-app}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-app}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-app}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - wardnode_internal

  prometheus:
    image: prom/prometheus:latest
    container_name: wardnode-prometheus
    restart: unless-stopped
    mem_limit: 256m
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - wardnode_internal

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1
    container_name: wardnode-nginx-exporter
    restart: unless-stopped
    mem_limit: 32m
    command:
      - -nginx.scrape-uri=http://wardnode-proxy:8081/stub_status
    depends_on:
      - proxy
    networks:
      - wardnode_internal

  # ── WardNode DDoS — CrowdSec SSH brute-force protection ─────────────
  crowdsec:
    # Pin por digest para builds reproducibles (supply chain hardening).
    # Para actualizar: docker pull crowdsecurity/crowdsec:latest && docker inspect --format '{{index .RepoDigests 0}}'
    image: crowdsecurity/crowdsec@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: wardnode-crowdsec
    restart: unless-stopped
    profiles:
      - ddos
    # En dev usamos network interna — en producción se usa network_mode: host
    environment:
      BOUNCER_KEY_wardnode: "${WARDNODE_DDOS_BOUNCER_KEY:-dev-key-placeholder}"
      COLLECTIONS: "crowdsecurity/sshd"
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/ssh.yaml:ro
    networks:
      - wardnode_internal

  crowdsec-bouncer:
    build:
      context: ./crowdsec
    container_name: wardnode-crowdsec-bouncer
    restart: unless-stopped
    profiles:
      - ddos
    cap_add:
      - NET_ADMIN
    environment:
      API_KEY: "${WARDNODE_DDOS_BOUNCER_KEY:-dev-key-placeholder}"
      # En dev usamos red bridge — el daemon es accesible por nombre de servicio,
      # no por 127.0.0.1 (que apuntaría al bouncer mismo). Puerto 8080 por defecto.
      API_URL: "http://crowdsec:8080"
    depends_on:
      - crowdsec
    networks:
      - wardnode_internal

volumes:
  postgres_data:
  backups:
  proxy_generated:
  geoip_data:
  proxy_logs:
  modsecurity_logs:
  letsencrypt:
  certbot_challenges:
  loki_data:
  grafana_data:
  alloy_data:
  prometheus_data:
  crowdsec-config:
  crowdsec-data:
  log-archives:

networks:
  wardnode_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
