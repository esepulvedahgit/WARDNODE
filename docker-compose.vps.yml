# Stack de producción para el VPS.
# Requiere imágenes ya cargadas con `docker load`.
# NO necesita código fuente ni `docker build`.
services:
  console:
    image: wardnode-console:prod
    container_name: wardnode-console
    restart: unless-stopped
    env_file: .env.prod
    environment:
      FLASK_ENV: production
      WF_SOCKET_PATH: /app/sockets/wardnode-wf.sock
      WF_SSH_HOST: "127.0.0.1"
      WN_CONSOLE_URL: "http://127.0.0.1:5000"
      # Contenedor del que se ingieren los eventos ModSecurity (WAF Events + módulo SOC)
      WARDNODE_PROXY_CONTAINER: wardnode-proxy
      # Docker SDK apunta al proxy de socket en vez del socket crudo
      DOCKER_HOST: "tcp://127.0.0.1:2375"
    network_mode: host
    volumes:
      - proxy_generated:/app/generated/nginx
      - geoip_data:/app/data/geoip
      - /run/wardnode:/app/sockets:rw
      - ${WARDNODE_PROJECT_DIR:-/opt/wardnode}:${WARDNODE_PROJECT_DIR:-/opt/wardnode}:ro
      - obs_alloy_config:/tmp/obs/alloy
      - obs_loki_config:/tmp/obs/loki
      - obs_prometheus_config:/tmp/obs/prometheus
      - obs_grafana_provisioning:/tmp/obs/grafana_provisioning
      - modsecurity_logs:/var/log/modsec:ro
      - backups:/app/data/backups
      - letsencrypt:/etc/letsencrypt:ro
    group_add:
      - "1500"  # grupo wardnode del host — acceso al socket Unix del agente WF
    depends_on:
      db:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        mkdir -p /tmp/obs/alloy /tmp/obs/loki /tmp/obs/prometheus /tmp/obs/grafana_provisioning &&
        cp /app/observability/alloy/config.alloy /tmp/obs/alloy/config.alloy &&
        cp /app/observability/loki.yaml /tmp/obs/loki/config.yaml &&
        cp /app/observability/prometheus.yml /tmp/obs/prometheus/prometheus.yml &&
        cp -r /app/observability/grafana/provisioning/. /tmp/obs/grafana_provisioning/ &&
        flask db-setup && flask ensure-geoip &&
        gunicorn -c gunicorn.conf.py wsgi:app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: wardnode-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # inspect/list (ingest logs, backup, status)
      EXEC: 1         # pg_dump/pg_restore, cscli, certbot exec
      POST: 1         # exec_start, containers.run (certbot)
      IMAGES: 1
      NETWORKS: 1     # docker compose: crear/inspeccionar la red wardnode_internal (perfil obs)
      VOLUMES: 1      # docker compose: crear volúmenes nombrados (crowdsec-config/-data, loki_data, …)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    networks:
      - wardnode_internal

  proxy:
    image: wardnode-proxy:prod
    container_name: wardnode-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
      - "console:127.0.0.1"
    network_mode: host
    volumes:
      - proxy_generated:/etc/nginx/generated:ro
      - geoip_data:/etc/nginx/geoip:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot
      - ./certs:/etc/nginx/certs:ro
      - proxy_logs:/var/log/nginx
      - modsecurity_logs:/var/log
    depends_on:
      - console

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot
    entrypoint: certbot

  db:
    image: postgres:16-alpine
    container_name: wardnode-db
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wardnode_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── WardNode OBS — Recolección/almacenamiento (arrancan siempre) ─────
  # Loki + Alloy + Prometheus arrancan con el stack base para minimizar
  # la fuga de logs. Solo Grafana (visualización) está detrás del módulo OBS.
  alloy:
    image: grafana/alloy:latest
    container_name: wardnode-alloy
    restart: unless-stopped
    user: root
    mem_limit: 256m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - obs_alloy_config:/etc/alloy:ro
      - alloy_data:/var/lib/alloy/data
      - proxy_logs:/var/log/nginx:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    depends_on:
      console:
        condition: service_healthy
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - wardnode_internal

  loki:
    image: grafana/loki:3
    container_name: wardnode-loki
    restart: unless-stopped
    mem_limit: 256m
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki_data:/loki
      - obs_loki_config:/etc/loki:ro
    depends_on:
      console:
        condition: service_healthy
    networks:
      - wardnode_internal

  # ── WardNode OBS — Visualización (perfil opcional, módulo OBS) ────────
  grafana:
    image: grafana/grafana:11.5
    container_name: wardnode-grafana
    restart: unless-stopped
    profiles:
      - obs
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env.prod}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/obs/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LOG_LEVEL: warn
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"
      GF_AUTH_PROXY_WHITELIST: "172.30.0.1/32"
      # Credenciales DB para el datasource PostgreSQL de Grafana
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - obs_grafana_provisioning:/etc/grafana/provisioning:ro
    depends_on:
      console:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - wardnode_internal

  prometheus:
    image: prom/prometheus:latest
    container_name: wardnode-prometheus
    restart: unless-stopped
    mem_limit: 256m
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - obs_prometheus_config:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      console:
        condition: service_healthy
    networks:
      - wardnode_internal

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1
    container_name: wardnode-nginx-exporter
    restart: unless-stopped
    mem_limit: 32m
    # En VPS el proxy usa network_mode: host — stub_status queda en
    # localhost del host, accesible vía host.docker.internal desde el bridge.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - -nginx.scrape-uri=http://host.docker.internal:8081/stub_status
    depends_on:
      console:
        condition: service_healthy
    networks:
      - wardnode_internal

  # ── WardNode DDoS — CrowdSec SSH brute-force protection ─────────────
  crowdsec:
    # Pin por digest para builds reproducibles (supply chain hardening).
    # Para actualizar: docker pull crowdsecurity/crowdsec:latest && docker inspect --format '{{index .RepoDigests 0}}'
    image: crowdsecurity/crowdsec@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: wardnode-crowdsec
    restart: unless-stopped
    profiles:
      - ddos
    # network_mode host: cscli puede conectar a bouncers en localhost del host.
    network_mode: host
    # Genera archivos de config dentro del contenedor en cada arranque — sin depender de
    # archivos del host. Evita el footgun de Docker (crea directorio si el fuente no existe).
    # ENTRYPOINT oficial de la imagen: ["/bin/bash", "/docker_start.sh"].
    # Contenido de acquis.d/ssh.yaml equivale a crowdsec/acquis.yaml (referencia para dev).
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'api:\n  server:\n    listen_uri: 127.0.0.1:9080\n' > /etc/crowdsec/config.yaml.local
        mkdir -p /etc/crowdsec/acquis.d
        rm -rf /etc/crowdsec/acquis.d/ssh.yaml
        printf '%s\n' '---' 'filenames:' '  - /var/log/auth.log' 'labels:' '  type: syslog' '---' 'source: journalctl' 'journalctl_filter:' '  - "_SYSTEMD_UNIT=ssh.service"' 'labels:' '  type: syslog' > /etc/crowdsec/acquis.d/ssh.yaml
        exec /bin/bash /docker_start.sh
    environment:
      # Clave pre-registrada para el bouncer. WARDNODE_DDOS_BOUNCER_KEY
      # se inyecta por Flask en runtime — nunca se escribe a disco.
      BOUNCER_KEY_wardnode: "${WARDNODE_DDOS_BOUNCER_KEY}"
      COLLECTIONS: "crowdsecurity/sshd"
      # Mover LAPI a 9080 para evitar conflicto con el puerto 8080 del host.
      # El bouncer también debe apuntar a este puerto vía API_URL.
      LOCAL_API_URL: "http://127.0.0.1:9080"
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      # Logs SSH del host montados solo-lectura
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/journal:/var/log/journal:ro
    # Esperar a que el LAPI esté escuchando en 9080 antes de que el bouncer arranque.
    # Elimina la carrera de arranque que produce "connection refused" en el bouncer.
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  crowdsec-bouncer:
    image: wardnode-crowdsec-bouncer:prod
    container_name: wardnode-crowdsec-bouncer
    restart: unless-stopped
    profiles:
      - ddos
    # network_mode host + NET_ADMIN: mínimo para gestionar reglas nftables
    # en el namespace de red del host. Nunca privileged.
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      API_KEY: "${WARDNODE_DDOS_BOUNCER_KEY}"
      # Debe coincidir con LOCAL_API_URL del daemon (9080 en producción).
      API_URL: "http://127.0.0.1:9080"
    depends_on:
      crowdsec:
        condition: service_healthy

volumes:
  postgres_data:
  backups:
  proxy_generated:
  geoip_data:
  proxy_logs:
  modsecurity_logs:
  letsencrypt:
  certbot_challenges:
  loki_data:
  grafana_data:
  alloy_data:
  prometheus_data:
  obs_alloy_config:
  obs_loki_config:
  obs_prometheus_config:
  obs_grafana_provisioning:
  crowdsec-config:
  crowdsec-data:

networks:
  wardnode_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
