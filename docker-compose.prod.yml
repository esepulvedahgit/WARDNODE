# Usado SOLO en la máquina de desarrollo para construir y etiquetar imágenes.
# Comando: docker compose -f docker-compose.prod.yml build
# Luego exportar con: bash scripts/build-prod.sh
services:
  console:
    build: .
    image: wardnode-console:prod

  proxy:
    build:
      context: ./proxy
    image: wardnode-proxy:prod

  # Bouncer CrowdSec — imagen pre-construida para el perfil ddos en producción.
  # Sin 'build' no puede crearse en el VPS con --no-build; por eso se genera
  # aquí en desarrollo y se exporta con docker save/load.
  crowdsec-bouncer:
    build:
      context: ./crowdsec
    image: wardnode-crowdsec-bouncer:prod
