<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Grafana fullscreen | WardNode</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --wn-bg: #0f172a;
      --wn-panel: rgba(15, 23, 42, 0.92);
      --wn-border: rgba(148, 163, 184, 0.28);
      --wn-text: #e5e7eb;
      --wn-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--wn-bg);
      color: var(--wn-text);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .obs-fullscreen {
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
      height: 100vh;
    }

    .obs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      background: var(--wn-panel);
      border-bottom: 1px solid var(--wn-border);
      backdrop-filter: blur(12px);
    }

    .obs-title {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .obs-title span:last-child {
      color: var(--wn-muted);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .obs-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .obs-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--wn-border);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      color: var(--wn-text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }

    .obs-btn:hover {
      background: rgba(255,255,255,0.09);
      color: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #111827;
    }
  </style>
</head>
<body>
  <div class="obs-fullscreen">
    <header class="obs-bar">
      <div class="obs-title">
        <i class="bi bi-bar-chart-line-fill"></i>
        <span>WardNode OBS</span>
        <span>Grafana fullscreen</span>
      </div>
      <div class="obs-actions">
        <a class="obs-btn" href="{{ url_for('modules.obs_index') }}">
          <i class="bi bi-arrow-left"></i>
          <span>Volver al panel</span>
        </a>
        <a class="obs-btn" href="/obs/" title="Abrir Grafana directo">
          <i class="bi bi-box-arrow-up-right"></i>
          <span>Grafana directo</span>
        </a>
      </div>
    </header>
    <iframe src="/obs/" title="Grafana" loading="eager"></iframe>
  </div>
</body>
</html>
