{% extends "base.html" %}

{% block title %}Nueva contrasena | WardNode{% endblock %}

{% block content %}
<section class="auth-panel panel mx-auto">
  <h1 class="h4 mb-3">Definir nueva contrasena</h1>
  <form method="post" action="{{ url_for('auth.reset_password_post', token=token) }}" class="vstack gap-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="form-label" for="password">Nueva contrasena</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
    </div>
    <div>
      <label class="form-label" for="password_confirm">Confirmar contrasena</label>
      <input class="form-control" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="12" required>
    </div>
    <button class="btn btn-primary" type="submit">Actualizar contrasena</button>
  </form>
</section>
{% endblock %}
