{% extends "base.html" %}

{% block title %}Nueva contraseña | WardNode{% endblock %}

{% block content %}
<section class="auth-panel panel mx-auto">
  <h1 class="h4 mb-3">Definir nueva contraseña</h1>
  <form method="post" action="{{ url_for('auth.reset_password_post', token=token) }}"
        class="vstack gap-3" x-data="wnPasswordPolicy()">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% with label_password = "Nueva contraseña" %}
      {% include "auth/_password_fields.html" %}
    {% endwith %}
    <button class="btn btn-primary" type="submit" :disabled="!allOk">Actualizar contraseña</button>
  </form>
</section>
{% endblock %}
