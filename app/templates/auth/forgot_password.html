{% extends "base.html" %}

{% block title %}Recuperar contraseña | WardNode{% endblock %}

{% block content %}
<section class="auth-panel panel mx-auto">
  <h1 class="h4 mb-3">Recuperar contraseña</h1>
  <form method="post" action="{{ url_for('auth.forgot_password_post') }}" class="vstack gap-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="form-label" for="email">Correo</label>
      <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <button class="btn btn-primary" type="submit">Enviar instrucciones</button>
  </form>
  {% if reset_url %}
    <div class="alert alert-warning mt-3">
      <a href="{{ reset_url }}">Enlace de recuperación temporal</a>
    </div>
  {% endif %}
</section>
{% endblock %}
