{% extends "base.html" %}

{% block title %}429 – Demasiadas solicitudes | WardNode{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-icon-wrap error-icon-warning">
      <i class="bi bi-hourglass-split"></i>
    </div>
    <div class="error-code">429</div>
    <h1 class="error-title">Demasiadas solicitudes</h1>
    <p class="error-desc">Has superado el límite de intentos permitidos. Espera unos minutos antes de volver a intentarlo.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary error-btn">
      <i class="bi bi-arrow-left me-2"></i>Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
