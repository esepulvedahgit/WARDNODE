{% extends "base.html" %}

{% block title %}400 – Solicitud incorrecta | WardNode{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-icon-wrap error-icon-warning">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <div class="error-code">400</div>
    <h1 class="error-title">Solicitud incorrecta</h1>
    <p class="error-desc">La solicitud no pudo procesarse. Verifica los datos enviados e intenta nuevamente.</p>
    <a href="{{ url_for('proxy.dashboard') }}" class="btn btn-primary error-btn">
      <i class="bi bi-arrow-left me-2"></i>Volver al dashboard
    </a>
  </div>
</div>
{% endblock %}
