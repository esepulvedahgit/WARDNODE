{% extends "base.html" %}

{% block title %}{{ code }} – {{ title }} | WardNode{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-icon-wrap error-icon-{{ icon_variant|default('danger') }}">
      <i class="bi {{ icon|default('bi-exclamation-octagon-fill') }}"></i>
    </div>
    <div class="error-code">{{ code }}</div>
    <h1 class="error-title">{{ title }}</h1>
    <p class="error-desc">{{ desc }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary error-btn">
      <i class="bi bi-arrow-left me-2"></i>Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
