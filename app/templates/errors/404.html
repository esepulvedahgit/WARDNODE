{% extends "base.html" %}

{% block title %}404 – Página no encontrada | WardNode{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-icon-wrap error-icon-neutral">
      <i class="bi bi-compass"></i>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-desc">El recurso que buscas no existe o fue movido.</p>
    <a href="{{ url_for('proxy.dashboard') }}" class="btn btn-primary error-btn">
      <i class="bi bi-arrow-left me-2"></i>Volver al dashboard
    </a>
  </div>
</div>
{% endblock %}
