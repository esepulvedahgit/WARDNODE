{% extends "base.html" %}

{% block title %}500 – Error interno | WardNode{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-icon-wrap error-icon-danger">
      <i class="bi bi-bug-fill"></i>
    </div>
    <div class="error-code">500</div>
    <h1 class="error-title">Error interno del servidor</h1>
    <p class="error-desc">Ocurrió un problema inesperado. El error fue registrado automáticamente para revisión.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary error-btn">
      <i class="bi bi-arrow-left me-2"></i>Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
