{% extends "base.html" %}

{% block title %}403 – Acceso denegado | WardNode{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-icon-wrap error-icon-danger">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <div class="error-code">403</div>
    <h1 class="error-title">Acceso denegado</h1>
    <p class="error-desc">No tienes permisos para acceder a este recurso.</p>
    <a href="{{ url_for('proxy.dashboard') }}" class="btn btn-primary error-btn">
      <i class="bi bi-arrow-left me-2"></i>Volver al dashboard
    </a>
  </div>
</div>
{% endblock %}
