{% extends "base.html" %}

{% block title %}405 – Método no permitido | WardNode{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-icon-wrap error-icon-warning">
      <i class="bi bi-slash-circle-fill"></i>
    </div>
    <div class="error-code">405</div>
    <h1 class="error-title">Método no permitido</h1>
    <p class="error-desc">Esta acción no está permitida en el recurso solicitado.</p>
    <a href="{{ url_for('proxy.dashboard') }}" class="btn btn-primary error-btn">
      <i class="bi bi-arrow-left me-2"></i>Volver al dashboard
    </a>
  </div>
</div>
{% endblock %}
