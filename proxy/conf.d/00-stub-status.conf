# WardNode — Endpoint interno de métricas nginx
#
# Expone /stub_status en el puerto 8081 exclusivamente para el colector
# nginx-prometheus-exporter. No está expuesto al exterior: ninguna regla
# del firewall abre el 8081 y modsecurity se desactiva para este bloque.
#
# Acceso permitido solo desde la red interna de Docker (172.16/12, 10/8)
# y desde localhost.

server {
    listen 8081;
    server_name _;
    modsecurity off;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }

    # Devolver 404 para cualquier otra ruta
    location / {
        return 404;
    }
}
