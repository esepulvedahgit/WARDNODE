# WardNode OBS — Grafana vía nginx en /obs/
#
# Este bloque catch-all aplica cuando el dominio/IP no coincide con ningún site
# configurado en WardNode. Si tu dominio YA está configurado como site protegido,
# añade el bloque location /obs/ mediante "Nginx extras" en la configuración del site.
server {
    listen 80;
    server_name _;

    location /obs/ {
        proxy_pass         http://grafana:3000/obs/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
