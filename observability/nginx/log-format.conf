# WardNode — Formato de log JSON para NGINX
#
# Montar en el proxy como:
#   ./observability/nginx/log-format.conf:/etc/nginx/conf.d/00-log-format.conf:ro
#
# El prefijo 00- garantiza que este archivo se incluya antes de cualquier
# bloque server{} que use el formato json_combined.

log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"request_method":"$request_method",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer",'
    '"x_forwarded_for":"$http_x_forwarded_for"'
  '}';

access_log /var/log/nginx/access.json json_combined buffer=16k flush=5s;
error_log  /var/log/nginx/error.log warn;
