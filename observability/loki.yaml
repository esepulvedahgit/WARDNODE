auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h
  ingestion_rate_mb: 16
  max_query_series: 5000
  allow_structured_metadata: false
  # Habilita la Delete API por LogQL selector (POST /loki/api/v1/delete).
  # filter-and-delete: elimina las líneas del selector del chunk sin tocar
  # las líneas de otros streams del mismo chunk — seguro para borrado selectivo.
  deletion_mode: filter-and-delete

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  # Reducir periodo de gracia para que el borrado solicitado vía Delete API
  # se procese en ~5 min en lugar del default de 24h.
  delete_request_cancel_period: 5m
