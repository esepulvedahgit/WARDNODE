global:
  scrape_interval:     15s
  evaluation_interval: 15s

# Alloy envía todas las métricas vía remote_write (habilitado con
# --web.enable-remote-write-receiver en el servicio prometheus de compose).
# Prometheus solo se auto-monitorea aquí; Alloy reporta node y alloy.

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
