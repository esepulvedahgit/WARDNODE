[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     warn
    Parsers_File  parsers.conf
    DB            /var/fluent-bit/db/fluent-bit.db
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ── Docker container logs via fluentd driver ────────────────────────────
[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Tag_Prefix    wardnode.

# ── ModSecurity audit log (JSON estructurado en volumen modsecurity_logs) ──
[INPUT]
    Name            tail
    Path            /var/log/modsec/modsec_audit.log
    Parser          json
    Tag             modsec.audit
    DB              /var/fluent-bit/db/modsec.db
    Mem_Buf_Limit   5MB
    Skip_Long_Lines On
    Refresh_Interval 5

# ── Auth log del host (intentos SSH, sudo, PAM) ─────────────────────────
[INPUT]
    Name            tail
    Path            /var/log/auth.log
    Tag             host.auth
    DB              /var/fluent-bit/db/auth.db
    Mem_Buf_Limit   2MB
    Refresh_Interval 5

# ── CrowdSec logs del host ───────────────────────────────────────────────
[INPUT]
    Name            tail
    Path            /var/log/crowdsec/crowdsec.log
    Tag             crowdsec.logs
    DB              /var/fluent-bit/db/crowdsec.db
    Mem_Buf_Limit   5MB
    Skip_Long_Lines On
    Refresh_Interval 5

# ── Enriquecer con nombre del contenedor (logs via forward) ─────────────
[FILTER]
    Name    modify
    Match   wardnode.*
    Rename  source  container_name

# ── Output → Loki ────────────────────────────────────────────────────────
[OUTPUT]
    Name            loki
    Match           wardnode.*
    Host            loki
    Port            3100
    Labels          job=wardnode
    Label_Keys      $container_name
    Line_Format     json
    Auto_Kubernetes_Labels off

[OUTPUT]
    Name        loki
    Match       modsec.*
    Host        loki
    Port        3100
    Labels      job=wardnode,source=modsec_audit
    Line_Format json

[OUTPUT]
    Name        loki
    Match       host.*
    Host        loki
    Port        3100
    Labels      job=wardnode,source=host_auth
    Line_Format json

[OUTPUT]
    Name        loki
    Match       crowdsec.*
    Host        loki
    Port        3100
    Labels      job=crowdsec,service=crowdsec,module=security,source=crowdsec
    Line_Format json
