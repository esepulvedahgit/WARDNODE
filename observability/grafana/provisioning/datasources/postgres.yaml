apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    uid: wardnode-postgres
    url: db:5432
    user: ${POSTGRES_USER:-app}
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      database: ${POSTGRES_DB:-app}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-app}
